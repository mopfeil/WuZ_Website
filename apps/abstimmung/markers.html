<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marker drucken - ArUco Abstimmung</title>
  <style>
    body { margin: 0; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
           background: #0f2a30; color: #eef3f3; }
    #controls { padding: 14px; background: #08161a; display: flex; flex-wrap: wrap;
                gap: 10px; align-items: flex-end; position: sticky; top: 0; z-index: 2; }
    #controls label { font-size: 0.8rem; display: flex; flex-direction: column; gap: 3px; }
    #controls input { width: 5rem; padding: 6px; border-radius: 6px; border: 1px solid #2d6068;
                      background: #06181c; color: #eef3f3; font: inherit; }
    #controls button { padding: 9px 14px; border-radius: 8px; border: 1px solid #36d1c4;
                       background: #36d1c4; color: #06262b; font-weight: 700; cursor: pointer; }
    #controls button.ghost { background: transparent; color: #eef3f3; }
    #controls a { color: #36d1c4; font-size: 0.85rem; }
    #info { padding: 8px 14px; font-size: 0.82rem; color: #9fb0b0; }
    #sheet { display: flex; flex-wrap: wrap; gap: 6mm; padding: 8mm; background: #0f2a30; }

    .card { position: relative; background: #fff; color: #000;
            page-break-inside: avoid; break-inside: avoid; }
    .card .marker { position: absolute; left: 25%; top: 25%; width: 50%; height: 50%; }
    .card .marker svg { width: 100%; height: 100%; display: block; }
    .card .lt { position: absolute; font-weight: 700; line-height: 1;
                transform-origin: 50% 50%; }
    .card .mid { position: absolute; left: 50%; bottom: 3%; transform: translateX(-50%);
                 font-size: 3.2%; color: #444; }

    @media print {
      #controls, #info { display: none; }
      body, #sheet { background: #fff; }
      #sheet { padding: 0; gap: 4mm; }
    }
  </style>
</head>
<body>
  <div id="controls">
    <label>von Marker-Nr.<input id="from" type="number" min="0" value="0"></label>
    <label>bis Marker-Nr.<input id="to" type="number" min="0" value="149"></label>
    <label>Kartengr&ouml;&szlig;e (cm)<input id="size" type="number" min="3" max="20" value="8"></label>
    <button id="gen">Erzeugen</button>
    <button id="print" class="ghost">Drucken</button>
    <a href="index.html">&larr; zur&uuml;ck zur App</a>
  </div>
  <div id="info">
    Jede Karte zeigt einen Marker mit den Antwortbuchstaben rundherum. Der
    Buchstabe, der beim Hochhalten <b>oben</b> ist, ist die abgegebene Antwort.
  </div>
  <div id="sheet"></div>

  <script src="lib/cv.js"></script>
  <script src="lib/aruco.js"></script>
  <script src="markers.js"></script>
</body>
</html>
