<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14111b">
<title>FATUM – Das Gewölbe des Orakels</title>
<style>
:root{
  --bg:#14111b; --bg2:#1d1828; --panel:#241e33; --line:#3a3150; --ink:#efe6d0; --muted:#a79fb4;
  --gold:#e0b85a; --gold2:#f3d68a; --blood:#b8433c; --parch:#f1e6c8; --parch-ink:#2b2535; --stone:#cfc6b4; --dark:#0d0b12;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#2a2140 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-text-size-adjust:100%}
a{color:var(--gold2)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 16px;background:rgba(20,17,27,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.logo{font-family:var(--serif);font-weight:700;letter-spacing:.28em;color:var(--gold);font-size:18px;background:none;border:0;cursor:pointer;padding:6px 4px}
.top .sp{flex:1}
.ib{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;min-height:36px}
.ib[aria-pressed="true"]{border-color:var(--gold);color:var(--gold2)}
main{max-width:780px;margin:0 auto;padding:20px 16px 80px}
h1,h2,h3{font-family:var(--serif);line-height:1.15;margin:0 0 .4em}
h1{font-size:clamp(40px,11vw,76px);letter-spacing:.2em;color:var(--gold);text-align:center;margin-top:.3em}
h2{font-size:26px;color:var(--gold2);margin-top:1.6em}
h3{font-size:19px}
.tag{text-align:center;font-family:var(--serif);font-size:clamp(18px,4.4vw,24px);font-style:italic;max-width:30em;margin:0 auto 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 22px}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.cta{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0}
.btn{display:inline-block;background:linear-gradient(#f0cf7a,#d7a945);color:#2b2010;border:0;border-radius:10px;padding:14px 22px;font-size:17px;font-weight:700;font-family:var(--serif);cursor:pointer;text-decoration:none;min-height:48px}
.btn.ghost{background:none;color:var(--gold2);border:1px solid var(--gold)}
.btn.small{padding:9px 14px;font-size:15px;min-height:40px}
.btn:disabled{opacity:.4;cursor:default}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.card .n{font-family:var(--serif);color:var(--gold);font-size:14px;letter-spacing:.18em;text-transform:uppercase}
.card p{margin:.3em 0 0;color:#d9d0e2;font-size:15px}
.need{display:flex;gap:12px;align-items:center;margin:10px 0}
.need svg{width:46px;height:46px;flex:none}
.need b{display:block}
.need span{color:var(--muted);font-size:14px}
.sq{width:46px;height:46px;flex:none;border-radius:8px;background:var(--stone);color:var(--parch-ink);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:20px;border:3px solid #2b2535}
.say{background:var(--parch);color:var(--parch-ink);border-radius:14px;padding:18px 20px;font-family:var(--serif);font-size:19px;line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.4);position:relative;margin:14px 0}
.say:before{content:"";position:absolute;inset:5px;border:1px solid rgba(43,37,53,.25);border-radius:10px;pointer-events:none}
.say p{margin:0 0 .6em}.say p:last-child{margin:0}
.who{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#7a5a1c;font-family:var(--sans);font-weight:700;margin-bottom:6px}
.todo{list-style:none;padding:0;margin:14px 0;counter-reset:t}
.todo li{counter-increment:t;position:relative;padding:12px 14px 12px 52px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:8px 0;font-size:17px}
.todo li:before{content:counter(t);position:absolute;left:12px;top:11px;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#2b2010;font-weight:700;display:grid;place-items:center;font-size:15px}
.act{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
.dots{display:flex;gap:4px;flex:1;justify-content:flex-end}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--gold)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:18px}
.nav .btn{flex:1;text-align:center}
.nav .btn.ghost{flex:0 0 auto}
.boardwrap{margin:14px auto;max-width:340px;text-align:center}
.board{width:100%;height:auto;display:block}
.cap{color:var(--muted);font-size:13px;margin-top:4px}
.t-up{fill:var(--stone);stroke:#2b2535;stroke-width:5}
.t-dn{fill:#1a1524;stroke:#3a3150;stroke-width:3;stroke-dasharray:6 5}
.t-hl{fill:#e3b7a8;stroke:var(--blood);stroke-width:6}
.t-fin{fill:var(--gold2);stroke:var(--gold);stroke-width:6}
.t-p0{fill:#d9cdb2;stroke:#2b2535;stroke-width:5}
.t-p1{fill:#8fa3c4;stroke:#2b2535;stroke-width:5}
.t-num{font-family:var(--serif);font-weight:700;font-size:40px;fill:#2b2535;text-anchor:middle;dominant-baseline:central}
.players{display:flex;gap:10px;margin:10px 0 18px}
.players button{flex:1;min-height:56px;font-size:22px;font-family:var(--serif);font-weight:700;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.players button[aria-pressed="true"]{background:var(--gold);color:#2b2010;border-color:var(--gold)}
details{background:var(--bg2);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin:16px 0}
summary{cursor:pointer;color:var(--muted)}
.seal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.seal .q{flex:1;min-width:150px;font-family:var(--serif);font-size:18px}
.seal .v{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--gold2);min-width:2.2em;text-align:center}
.seal.open{border-color:var(--gold);background:linear-gradient(#2e2540,#241e33)}
.sealed-at{color:var(--muted);font-size:13px;text-align:center;margin:6px 0}
table.add{border-collapse:collapse;margin:10px auto;font-family:var(--serif);font-size:20px}
table.add td,table.add th{width:54px;height:46px;text-align:center;border:1px solid var(--line)}
table.add th{color:var(--gold2);background:var(--bg2)}
table.add td{background:var(--stone);color:var(--parch-ink);font-weight:700}
.ex{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
.ex p{margin:.5em 0}
.foot{color:var(--muted);font-size:13px;text-align:center;margin-top:40px}
.dl{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .45s ease}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="top">
  <button class="logo" data-act="home" aria-label="FATUM">FATUM</button>
  <span class="sp"></span>
  <button class="ib" id="bSound" data-act="sound" aria-pressed="false">♪</button>
  <button class="ib" id="bVoice" data-act="voice" aria-pressed="false">🗣</button>
  <button class="ib" id="bLang" data-act="lang">EN</button>
</div>
<main id="app"></main>

var app = document.getElementById('app');

function L(de,en){ return S.lang==='de' ? de : en; }
function transform(g,t){
  var out=[],r,c,rr,cc,x;
  for(r=0;r<3;r++){ out.push([]); for(c=0;c<3;c++){ rr=r; cc=c; if(t&1) rr=2-rr; if(t&2) cc=2-cc; if(t&4){ x=rr; rr=cc; cc=x; } out[r].push(g[rr][cc]); } }
  return out;
}
function rnd(n){ return Math.floor(Math.random()*n); }
function newGame(){
  S.layout = transform(BASE, rnd(8));
  S.k = [[3,5,7][rnd(3)], [3,5][rnd(2)], [3,5][rnd(2)]];
  S.step = 0; S.sealed = ''; S.done = false; S.shown = [false,false,false];
}
function rolls(){ return S.players>=4 ? 4 : 3; }
function toll(){ return 7*rolls(); }
function loot(){ return S.layout[0][0]+S.layout[1][1]+S.layout[2][2]; }
function finalRoom(){ return S.layout[2][0]; }
function room(p){ return S.layout[p[0]][p[1]]; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  try{
    var o = JSON.parse(localStorage.getItem(KEY) || 'null');
    if(o && o.layout && o.layout.length===3 && o.k && o.k.length===3 && o.shown){
      for(var k in S){ if(Object.prototype.hasOwnProperty.call(o,k)) S[k]=o[k]; }
      S.sound=false; S.voice=false; return true;
    }
  }catch(e){}
  return false;
}

/* ---------- Bilder ---------- */
function coin(i){
  return '<svg viewBox="-13 -13 26 26" aria-hidden="true"><circle r="12.5" fill="#2b2535" stroke="#0d0b12" stroke-width=".5"/>'+
    '<circle r="10.7" fill="none" stroke="#e0b85a" stroke-width="1"/><path fill="#e0b85a" fill-rule="evenodd" d="'+PATHS[i]+'"/></svg>';
}
function has(list,r,c){ for(var i=0;i<list.length;i++){ if(list[i][0]===r && list[i][1]===c) return true; } return false; }
function board(o){
  o = o || {};
  var down=o.down||[], hl=o.hl||[], fin=o.fin||[], seal=o.seal||[], s='<div class="boardwrap"><svg class="board" viewBox="0 0 318 318" role="img" aria-label="'+L('Lageplan','Map')+'">';
  for(var r=0;r<3;r++){ for(var c=0;c<3;c++){
    var x=9+c*100, y=9+r*100, cls='t-up', num=true;
    if(o.parity) cls = ((r+c)%2===0) ? 't-p0' : 't-p1';
    if(has(down,r,c)){ cls='t-dn'; num=false; }
    if(has(hl,r,c)) cls='t-hl';
    if(has(fin,r,c)) cls='t-fin';
    s+='<g transform="translate('+x+','+y+')"><rect class="'+cls+'" x="3" y="3" width="94" height="94" rx="8"/>';
    if(num) s+='<text class="t-num" x="50" y="'+(has(seal,r,c)?30:50)+'">'+S.layout[r][c]+'</text>';
    if(has(seal,r,c)) s+='<g transform="translate(50,66) scale(1.9)"><circle r="12.5" fill="#2b2535"/><path fill="#e0b85a" fill-rule="evenodd" d="'+PATHS[5]+'"/></g>';
    s+='</g>';
  } }
  s+='</svg>'+(o.cap?'<div class="cap">'+o.cap+'</div>':'')+'</div>';
  return s;
}

/* ---------- Schritte ---------- */
function steps(){
  var k=S.k, c1=COLLAPSE[0], c2=COLLAPSE[1], c3=COLLAPSE[2], n=rolls();
  var a1=L('Akt I · Die drei Siegel','Act I · The Three Seals'), a2=L('Akt II · Der Einsturz','Act II · The Collapse'), a3=L('Akt III · Der Wächter','Act III · The Guardian');
  function fall(cs, steps_, first){
    return {
      act:a2,
      say: (first
        ? L('Der Boden zittert. Kammer '+room(cs[0])+' und Kammer '+room(cs[1])+' stürzen ein. Erschreckt nicht: Ich weiß, dass dort keiner von euch steht.',
            'The floor trembles. Chamber '+room(cs[0])+' and chamber '+room(cs[1])+' cave in. Do not be afraid: I know that none of you is standing there.')
        : L('Wieder bricht Stein. Diesmal trifft es Kammer '+room(cs[0])+' und Kammer '+room(cs[1])+'. Auch dort steht niemand. Ich weiß es.',
            'Stone breaks again. This time it takes chamber '+room(cs[0])+' and chamber '+room(cs[1])+'. Nobody is standing there either. I know.')),

/* ---------- Ton ---------- */
var AC=null, master=null;
function sound(on){
  try{
    if(on){
      if(!AC){
        var C = window.AudioContext || window.webkitAudioContext; if(!C) return;
        AC = new C(); master = AC.createGain(); master.gain.value = 0;
        var f = AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=420;
        f.connect(master); master.connect(AC.destination);
        [55,82.4,110.3,164.8].forEach(function(hz,i){
          var o=AC.createOscillator(), g=AC.createGain(), l=AC.createOscillator(), lg=AC.createGain();
          o.type = i%2 ? 'sine' : 'triangle'; o.frequency.value=hz; g.gain.value = i<2 ? 0.5 : 0.18;
          l.frequency.value = 0.05+0.03*i; lg.gain.value = 0.15;
          l.connect(lg); lg.connect(g.gain); o.connect(g); g.connect(f); o.start(); l.start();
        });
      }
      AC.resume(); master.gain.setTargetAtTime(0.12, AC.currentTime, 1.5);
    } else if(AC){ master.gain.setTargetAtTime(0, AC.currentTime, 0.4); }
  }catch(e){}
}
function speak(html){
  try{
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    if(!S.voice || !html) return;
    var u = new SpeechSynthesisUtterance(String(html).replace(/<[^>]+>/g,' '));
    u.lang = S.lang==='de' ? 'de-DE' : 'en-GB'; u.rate = 0.9; u.pitch = 0.7;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function render(quiet){
  var h;
  if(S.screen==='setup') h=vSetup();
  else if(S.screen==='play') h=vPlay();
  else if(S.screen==='reveal') h=vReveal();
  else if(S.screen==='explain') h=vExplain();
  else h=vHome();
  app.innerHTML=h;
  document.documentElement.lang=S.lang;
  document.getElementById('bLang').textContent = S.lang==='de' ? 'EN' : 'DE';
  var bs=document.getElementById('bSound'), bv=document.getElementById('bVoice');
  bs.setAttribute('aria-pressed', String(S.sound)); bs.textContent='♪ '+L('Klang','Sound');
  bv.setAttribute('aria-pressed', String(S.voice)); bv.textContent=L('Stimme','Voice');
  save();
  if(!quiet){
    window.scrollTo(0,0);
    var el=document.getElementById('sayText');
    speak(el ? el.innerHTML : '');
  }
}

  var a = el.getAttribute('data-act'), n = parseInt(el.getAttribute('data-n'),10);
  if(a==='lang'){ S.lang = S.lang==='de' ? 'en' : 'de'; render(true); }
  else if(a==='sound'){ S.sound=!S.sound; sound(S.sound); render(true); }
  else if(a==='voice'){ S.voice=!S.voice; render(true); var t=document.getElementById('sayText'); speak(t ? t.innerHTML : ''); }
  else if(a==='home'){ go('home'); }
  else if(a==='setup'){ if(S.sealed && !S.done && S.step>0){ go('play'); } else { if(S.sealed) newGame(); go('setup'); } }
  else if(a==='players'){ S.players=n; render(true); }
  else if(a==='seal'){
    var d=new Date(), mm=d.getMinutes();
    S.sealed = d.getHours()+':'+(mm<10?'0':'')+mm; S.step=0; S.shown=[false,false,false]; go('play');
  }
  else if(a==='next'){ S.step++; go('play'); }
  else if(a==='prev'){ if(S.step>0){ S.step--; go('play'); } else { go('setup'); } }
  else if(a==='reveal'){ S.done=true; go('reveal'); }
  else if(a==='show'){ S.shown[n]=true; render(true); }
  else if(a==='explain'){ go('explain'); }
  else if(a==='again'){ newGame(); go('setup'); }
});

if(!load()){
  try{ S.lang = /^de/i.test(navigator.language||'de') ? 'de' : 'en'; }catch(e){}
  newGame();
}
render(true);
})();
</script>
