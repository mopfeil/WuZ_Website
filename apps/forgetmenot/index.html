<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Forget-me-not Trainer</title>
<style>
:root{
  --bg:#f6f4ef; --panel:#ffffff; --ink:#1f2328; --muted:#6a6f76; --line:#dcd8cf; --accent:#3b5bdb; --accent-ink:#fff;
  --ok:#2f9e44; --bad:#e03131; --chip:#efece5;
  --c0:#dbe8f7; --c1:#dfeed6; --c2:#fff0c2; --c3:#fbe0d3;
  --c0s:#3d6fb6; --c1s:#3f8a3a; --c2s:#b08300; --c3s:#c0532b;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#16181c; --panel:#20232a; --ink:#e7e9ec; --muted:#9aa1ab; --line:#353a43; --accent:#7c93f5; --accent-ink:#0e1220;
  --ok:#51cf66; --bad:#ff6b6b; --chip:#2a2e36;
  --c0:#1f3047; --c1:#22351f; --c2:#3a3115; --c3:#3e2519;
  --c0s:#8fb4ea; --c1s:#8fd18a; --c2s:#e6c260; --c3s:#f09a76;
}}
:root[data-theme="dark"]{
  --bg:#16181c; --panel:#20232a; --ink:#e7e9ec; --muted:#9aa1ab; --line:#353a43; --accent:#7c93f5; --accent-ink:#0e1220;
  --ok:#51cf66; --bad:#ff6b6b; --chip:#2a2e36;
  --c0:#1f3047; --c1:#22351f; --c2:#3a3115; --c3:#3e2519;
  --c0s:#8fb4ea; --c1s:#8fd18a; --c2s:#e6c260; --c3s:#f09a76;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;margin-right:auto;white-space:nowrap}
.brand small{font-weight:400;color:var(--muted);margin-left:6px}
nav{max-width:980px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
nav button{border:0;background:none;color:var(--muted);padding:8px 12px;font:inherit;font-size:15px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:980px;margin:0 auto;padding:18px 16px 60px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--ink);padding:5px 11px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13.5px}
h2{font-size:19px;margin:0 0 10px}
h3{font-size:16px;margin:16px 0 8px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
.btn.link{border:0;background:none;color:var(--accent);padding:4px 6px}
input[type=text]{font:inherit;font-size:18px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;max-width:420px}
input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 9px;font-size:13px;color:var(--muted)}
.cardq{min-height:250px;display:flex;flex-direction:column;gap:14px}
.q{font-size:22px;line-height:1.35}
.q b{font-weight:700}
.ans{border-top:1px dashed var(--line);padding-top:12px;font-size:17px}
.ans .big{font-size:22px;font-weight:700}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.hint{background:var(--chip);border-radius:8px;padding:8px 12px;font-size:15px}
.boxes{display:flex;gap:6px;align-items:flex-end;height:64px}
.boxes div{flex:1;background:var(--accent);opacity:.75;border-radius:4px 4px 0 0;min-height:2px;position:relative}
.boxes div span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted)}
.boxlbl{display:flex;gap:6px;font-size:12px;color:var(--muted)} .boxlbl span{flex:1;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:720px){.grid2{grid-template-columns:1fr}.q{font-size:20px}}
.lessons label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:15px}
.lessons .prog{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
.pbar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin-top:3px}
.pbar i{display:block;height:100%;background:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:600}
.tblwrap{overflow-x:auto}
.cg0{background:var(--c0)} .cg1{background:var(--c1)} .cg2{background:var(--c2)} .cg3{background:var(--c3)}
.ring{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:720px){.ring{grid-template-columns:1fr 1fr}}
.cyc{border-radius:10px;padding:10px 12px}
.cyc ol{margin:6px 0 0;padding-left:22px;font-size:14.5px}
.cyc li.o{font-weight:700}
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.palace svg{width:100%;height:auto;display:block}
.story{font-size:16px;font-style:italic;margin:6px 0 0}
.step{font-size:17px;min-height:52px}
.kbd{font-family:ui-monospace,monospace;font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
.spect{font-size:20px;line-height:1.6}
.spect q{font-weight:700}
.timer{font-variant-numeric:tabular-nums;font-size:15px;color:var(--muted)}
.page{border:1px solid var(--line);border-radius:8px;padding:8px 14px;background:var(--bg);max-width:340px}
.page ol{margin:0;padding-left:24px;font-family:Georgia,serif;font-size:17px}
.page li.f{background:var(--c2);font-weight:700}
.page li.l{text-decoration:underline}
.center{text-align:center}
.mt{margin-top:14px}
.hide{display:none!important}
</style>
</head>

/* ---------------- storage ---------------- */
const KEY = "fmn-trainer-v1";
let STORE_OK = true;
function loadState(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)||"null"); if(s) return s; }catch(e){ STORE_OK=false; }
  return {lang:"de", tab:"learn", de:{}, en:{}};
}
let S = loadState();
for(const l of ["de","en"]){ S[l] = Object.assign({cards:{}, lessons:[true,true,true,true,true,true], newPer:10, perf:[]}, S[l]||{}); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ STORE_OK=false; } }
try{ localStorage.setItem(KEY+"-t","1"); localStorage.removeItem(KEY+"-t"); }catch(e){ STORE_OK=false; }

/* ---------------- helpers ---------------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (s,o)=> s.replace(/\{(\w+)\}/g,(m,k)=> k in o ? o[k] : m);
function norm(s){ return String(s).toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]/g,""); }
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const DAY = 864e5, INTERVAL = [0,0,1,3,7,16];
let L = S.lang; let D = DATA[L]; let TX = T[L];
const cardOf = w => Math.floor(D.words[w].nr/4);
const readingOf = w => { const x=D.words[w], c=D.concepts[x.nr]; return x.t==="O"? c.oread : c.pread; };
const conceptWord = (w) => { const x=D.words[w], c=D.concepts[x.nr]; return x.t==="O"? c.o : c.p; };
function blank(sentence, variants){
  let s = esc(sentence);
  for(const v of variants.slice().sort((a,b)=>b.length-a.length)){
    const re = new RegExp(v.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "i"); s = s.replace(re, "____");
  }
  return s;
}
const romAccept = g => [ROM[g], String(g+1)];

/* ---------------- card generation ---------------- */
function makeCards(){
  const C = [], q = TX.q, lv = D.levels;
  const add = (lesson,id,qh,ah,accept,hint) => C.push({lesson,id,q:qh,a:ah,accept,hint});
  // L0 numbers & originals
  for(const c of D.concepts){
    add(0,"num-o-"+c.nr, fmt(q.num_o,{nr:c.nr}), `<span class="big">${esc(c.o[0])}</span> <span class="muted">· ${esc(c.o[1])} · ${esc(c.o[2])}</span><br><span class="muted">${esc(c.hook)}</span>`, c.o, esc(c.hook));
    add(0,"o-num-"+c.nr, fmt(q.o_num,{w:esc(c.o[0])}), `<span class="big">${TX.nr} ${c.nr}</span><br><span class="muted">${esc(c.hook)}</span>`, [String(c.nr)], esc(c.hook));
  }
  // L1 partners
  for(const c of D.concepts){
    const al = TX.alive;
    add(1,"o-p-"+c.nr, fmt(q.o_p,{w:esc(c.o[0])}), `<span class="big">${esc(c.p[0])}</span> <span class="muted">· ${esc(c.p[1])} · ${esc(c.p[2])}</span><br>${TX.qo}${esc(c.link)}${TX.qc}<br><span class="muted">${esc(c.o[0])}: ${al[c.oalive]} → ${esc(c.p[0])}: ${al[1-c.oalive]}</span>`, c.p, blank(c.link, c.p));
    add(1,"p-o-"+c.nr, fmt(q.p_o,{w:esc(c.p[0])}), `<span class="big">${esc(c.o[0])}</span> <span class="muted">(${TX.nr} ${c.nr})</span><br>${TX.qo}${esc(c.link)}${TX.qc}`, c.o, blank(c.link, c.o));
  }
  // L2 cards & scenes (palace)
  for(const c of D.concepts){
    const g = Math.floor(c.nr/4);
    add(2,"o-card-"+c.nr, fmt(q.o_card,{w:esc(c.o[0])}), `<span class="big">${TX.card} ${ROM[g]}</span> <span class="muted">(${TX.nr} ${4*g}–${4*g+3})</span><br>${esc(D.scenes[g][0])}`, romAccept(g), `${TX.nr} ${c.nr} · ${TX.card} = ${TX.nr} // 4`);
  }
  for(let g=0; g<4; g++){
    const os = D.concepts.slice(4*g,4*g+4);
    add(2,"scene-"+g, fmt(q.scene,{g:ROM[g], title:esc(D.scenes[g][0])}), `<span class="big">${os.map(c=>esc(c.o[0])).join(" · ")}</span><br><i>${TX.qo}${esc(D.scenes[g][1])}${TX.qc}</i>`, null, esc(D.scenes[g][1].split(/[:,]/)[0])+" …");
    add(2,"cycle-"+g, fmt(q.cycle,{g:ROM[g], deck:esc(lv[0])}), `<span class="big">${D.cards[0][g].map(esc).join(" → ")}</span> → …`, null, os.map(c=>esc(c.o[0])).join(" · ")+" · …");
  }
  // L3 variants
  for(const c of D.concepts){
    for(const [t,v] of [["O",c.o],["P",c.p]]){
      add(3,`vars-${t}-${c.nr}`, fmt(q.vars,{w:esc(v[0])}), `<span class="big">${esc(v[1])}</span> <span class="muted">(${esc(lv[1])})</span> · <span class="big">${esc(v[2])}</span> <span class="muted">(${esc(lv[2])})</span>`, null, `${esc(D.lenrule[1])} · ${esc(D.lenrule[2])}`);
      for(const d of [1,2]){
        const w=v[d], x=D.words[w];
        add(3,`var-${w}`, fmt(q.var,{w:esc(w)}), `<span class="big">${esc(lv[d])}</span> <span class="muted">(${esc(D.lenrule[d])})</span> · = <span class="big">${esc(v[0])}</span><br><span class="muted">${t==="O"?TX.O:TX.P} · ${TX.nr} ${c.nr} · ${TX.card} ${ROM[cardOf(w)]}</span>`, null, D.lenrule.map(esc).join(" · "));
      }
    }
  }
  // L4 successor, L5 reveal (all 96 words, decks in order)
  const order = [];
  for(let d=0; d<3; d++) for(let g=0; g<4; g++) for(const w of D.cards[d][g]) order.push(w);
  for(const w of order){
    const x=D.words[w], g=cardOf(w), d=x.deck, i=D.cards[d][g].indexOf(w), n=x.next;
    add(4,"next-"+w, fmt(q.next,{w:esc(w)}), `<span class="big">${esc(n)}</span><br><span class="muted">${esc(lv[d])} · ${TX.card} ${ROM[g]} · ${i+1} → ${(i+1)%8+1}</span>`, [n], `${esc(lv[d])} · ${TX.card} ${ROM[g]} · ${x.t==="O"?TX.O:TX.P} ${TX.nr} ${x.nr}`);
  }
  for(const w of order){
    const x=D.words[w];
    add(5,"rev-"+w, fmt(q.rev,{w:esc(w)}), `<span class="big">${esc(x.letter)}</span> <span class="muted">(${esc(w)} / ${esc(x.partner)})</span> · <span class="big">${TX.alive[x.alive]}</span><br>${esc(readingOf(w))}`, null, `${TX.P}: ${esc(x.partner)}`);
  }
  return C;
}
let CARDS = makeCards(); let BYID = Object.fromEntries(CARDS.map(c=>[c.id,c]));

/* ---------------- Leitner ---------------- */
const st = id => S[L].cards[id];
function grade(id, ok){
  const now = Date.now(); let s = st(id) || {box:0, right:0, wrong:0};
  if(ok){ s.box = Math.min(5, Math.max(1, s.box) + 1); s.right++; } else { s.box = 1; s.wrong++; }
  s.due = now + INTERVAL[s.box]*DAY - 3600e3; s.seen = now;
  S[L].cards[id] = s; save();
}
function activeCards(){ return CARDS.filter(c=>S[L].lessons[c.lesson]); }
function dueCards(){ const now=Date.now(); return activeCards().filter(c=>{const s=st(c.id); return s && s.box>0 && s.due<=now;}); }
function newCards(n){ return activeCards().filter(c=>!st(c.id) || !st(c.id).box).slice(0,n); }
function boxCounts(cards){ const b=[0,0,0,0,0,0]; for(const c of cards){ const s=st(c.id); b[s&&s.box?s.box:0]++; } return b; }

let SESSION = null;  // {queue:[ids], cur, phase:'ask'|'shown', typed, verdict, hintShown}
function startSession(mode){
  let ids;
  if(mode==="cram") ids = shuffle(activeCards().filter(c=>st(c.id)&&st(c.id).box).map(c=>c.id));
  else if(mode==="new") ids = newCards(S[L].newPer).map(c=>c.id);
  else {
    const due = shuffle(dueCards().map(c=>c.id)).sort((a,b)=>st(a).box-st(b).box);
    ids = due.concat(newCards(S[L].newPer).map(c=>c.id));
  }
  SESSION = {queue:ids, phase:"ask", done:0, right:0};
  render();
}

/* ---------------- views ---------------- */
const TABS = ["learn","palace","perform","ref","progress"];
function renderShell(){
  document.documentElement.lang = L;
  $("#subtitle").textContent = TX.sub;
  for(const b of document.querySelectorAll("#langSeg button")) b.classList.toggle("on", b.dataset.l===L);
  $("#tabs").innerHTML = TABS.map(t=>`<button data-t="${t}" class="${S.tab===t?"on":""}">${TX.tabs[t]}</button>`).join("");
}
function render(){
  renderShell();
  const m = $("#main");
  ({learn:viewLearn, palace:viewPalace, perform:viewPerform, ref:viewRef, progress:viewProgress})[S.tab](m);
}

function boxesHTML(cards){
  const b = boxCounts(cards), mx = Math.max(1,...b);
  return `<div class="boxes">${b.map(n=>`<div style="height:${Math.max(3,Math.round(56*n/mx))}px"><span>${n}</span></div>`).join("")}</div>
  <div class="boxlbl">${TX.boxNames.map(n=>`<span>${n}</span>`).join("")}</div>`;
}

function viewLearn(m){
  if(SESSION && SESSION.queue.length){ return viewCard(m); }
  const finished = SESSION && SESSION.done;
  const due = dueCards().length, nw = newCards(1e9).length;
  const lessons = TX.lessons.map((name,i)=>{
    const cs = CARDS.filter(c=>c.lesson===i), b = boxCounts(cs), solid = b[4]+b[5], seen = cs.length-b[0];
    return `<label><input type="checkbox" data-les="${i}" ${S[L].lessons[i]?"checked":""}>
      <span style="flex:1">${i+1}. ${esc(name)}<div class="pbar"><i style="width:${Math.round(100*seen/cs.length)}%;opacity:.45"></i></div><div class="pbar" style="margin-top:2px"><i style="width:${Math.round(100*solid/cs.length)}%"></i></div></span>
      <span class="prog">${seen}/${cs.length}</span></label>`;
  }).join("");
  m.innerHTML = `
  <div class="grid2">
    <div class="panel">
      ${finished?`<p><b>${SESSION.right}/${SESSION.done}</b> ✓</p>`:""}
      <h2>${TX.tabs.learn}</h2>
      <p class="muted small">${TX.learnIntro}</p>
      <p><span class="chip">${due} ${TX.due}</span> <span class="chip">${nw} ${TX.newc}</span></p>
      <div class="row">
        ${due||nw?`<button class="btn primary" id="go">${TX.start}</button>`:`<span>${TX.sessionDone}</span>`}
        ${!due&&nw?`<button class="btn" id="goNew">${TX.sessionDoneMore}</button>`:""}
        <button class="btn" id="cram">${TX.cram}</button>
      </div>
      <div class="row mt small"><label>${TX.newToday}: <select id="newPer">${[0,5,10,15,20,30,50].map(n=>`<option ${n==S[L].newPer?"selected":""}>${n}</option>`).join("")}</select></label></div>
      <h3>${TX.boxesH}</h3>
      <div style="padding-top:16px">${boxesHTML(activeCards())}</div>
      <p class="muted small">${TX.intervals}</p>
    </div>
    <div class="panel lessons"><h2>${TX.lessonsH}</h2>${lessons}</div>
  </div>`;
  if($("#go")) $("#go").onclick=()=>startSession("due");
  if($("#goNew")) $("#goNew").onclick=()=>startSession("new");
  $("#cram").onclick=()=>startSession("cram");
  $("#newPer").onchange=e=>{S[L].newPer=+e.target.value; save(); render();};
  for(const cb of m.querySelectorAll("[data-les]")) cb.onchange=e=>{S[L].lessons[+e.target.dataset.les]=e.target.checked; save(); render();};
}

function viewCard(m){
  const Sx = SESSION, c = BYID[Sx.queue[0]], s = st(c.id);
  const boxTxt = s&&s.box ? `${TX.boxesH.split(" ")[0]} ${s.box}` : TX.newc;
  let body = `<div class="panel cardq">
    <div class="row small"><span class="chip">${c.lesson+1}. ${esc(TX.lessons[c.lesson])}</span><span class="chip">${boxTxt}</span><span class="muted" style="margin-left:auto">${fmt(TX.queue,{n:Sx.queue.length})}</span></div>
    <div class="q">${c.q}</div>`;
  if(Sx.phase==="ask"){
    body += `${Sx.hintShown?`<div class="hint">${c.hint}</div>`:""}
    <div><input type="text" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(TX.typeHere)}"></div>
    <div class="row"><button class="btn primary" id="sub">${TX.check}</button>${c.hint&&!Sx.hintShown?`<button class="btn link" id="hint">${TX.hint}</button>`:""}</div>`;
  } else {
    const auto = Sx.verdict!==undefined;
    body += `${Sx.typed?`<div class="small muted">${TX.yourAns}: <b>${esc(Sx.typed)}</b> ${auto?`<span class="verdict ${Sx.verdict?"ok":"bad"}">${Sx.verdict?TX.right:TX.wrong}</span>`:""}</div>`:""}
      <div class="ans">${c.a}</div>`;
    if(auto) body += `<div class="row"><button class="btn primary" id="nx">${TX.next}</button><button class="btn link" id="ovr">${Sx.verdict?TX.overrideBad:TX.override}</button></div>`;
    else body += `<div class="row"><button class="btn bad" id="no">${TX.didnt} <span class="kbd">1</span></button><button class="btn ok" id="yes">${TX.knew} <span class="kbd">2</span></button></div>`;
  }
  body += `</div><p class="center"><button class="btn link" id="quit">✕ ${TX.tabs.learn}</button></p>`;
  m.innerHTML = body;
  if(Sx.phase==="ask"){
    const inp=$("#inp"); inp.focus();
    const submit=()=>{
      Sx.typed = inp.value.trim();
      if(Sx.typed && c.accept){ Sx.verdict = c.accept.some(a=>norm(a)===norm(Sx.typed)); } else delete Sx.verdict;
      Sx.phase="shown"; render();
    };
    $("#sub").onclick=submit; inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); submit(); } };
    if($("#hint")) $("#hint").onclick=()=>{ Sx.hintShown=true; const v=inp.value; render(); $("#inp").value=v; };
  } else {
    const finish = ok => {
      grade(c.id, ok); Sx.done++; if(ok) Sx.right++;
      Sx.queue.shift(); if(!ok) Sx.queue.splice(Math.min(3,Sx.queue.length),0,c.id);
      Sx.phase="ask"; Sx.typed=""; Sx.hintShown=false; delete Sx.verdict; render();
    };
    if($("#nx")){ $("#nx").onclick=()=>finish(Sx.verdict); $("#ovr").onclick=()=>finish(!Sx.verdict); $("#nx").focus(); }
    else { $("#yes").onclick=()=>finish(true); $("#no").onclick=()=>finish(false); $("#yes").focus(); }
    KEYH = e=>{ if($("#yes")){ if(e.key==="1") finish(false); if(e.key==="2") finish(true); } };
  }
  $("#quit").onclick=()=>{ SESSION=null; render(); };
}
let KEYH = null;
document.addEventListener("keydown", e=>{ if(KEYH && e.target.tagName!=="INPUT" && S.tab==="learn" && SESSION) KEYH(e); });

/* ---------------- memory palace ---------------- */
let PAL = {g:0, d:0, mode:"view", step:0, quizOrder:[], qi:0, right:0, results:{}, rand:false, last:null};
function palaceSVG(g, d, highlight, hidden, results){
  const cyc = D.cards[d][g], W=680, H=440, col = `var(--c${g}s)`;
  const bw=250, bh=118, m=26;
  const box = [[m,m],[W-m-bw,m],[W-m-bw,H-m-bh],[m,H-m-bh]];   // stations clockwise: top-left, top-right, bottom-right, bottom-left
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(D.scenes[g][0])}">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${col}"/></marker></defs>
  <rect x="2" y="2" width="${W-4}" height="${H-4}" rx="22" fill="var(--c${g})" stroke="${col}" stroke-opacity=".35"/>
  <text x="${W/2}" y="${H/2-8}" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">${TX.card} ${ROM[g]}</text>
  <text x="${W/2}" y="${H/2+15}" text-anchor="middle" font-size="14" fill="var(--muted)">${esc(D.scenes[g][0])}</text>
  <text x="${W/2}" y="${H/2+34}" text-anchor="middle" font-size="12" fill="var(--muted)">${TX.nr} ${4*g}–${4*g+3} · ${esc(D.levels[d])}</text>`;
  const arrows = [[m+bw+10,m+bh/2, W-m-bw-10,m+bh/2],[W-m-bw/2,m+bh+10, W-m-bw/2,H-m-bh-10],
                  [W-m-bw-10,H-m-bh/2, m+bw+10,H-m-bh/2],[m+bw/2,H-m-bh-10, m+bw/2,m+bh+10]];
  arrows.forEach(([x1,y1,x2,y2],k)=>{ s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="2.5" ${k===3?'stroke-dasharray="6 5"':""} marker-end="url(#ar)" opacity=".7"/>`; });
  s += `<text x="${m+bw/2+10}" y="${H/2+4}" font-size="12" fill="${col}" font-weight="600">${TX.pal.roundSwitch}</text>`;
  for(let st=0; st<4; st++){
    const [bx,by] = box[st];
    s += `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="14" fill="var(--panel)" stroke="${col}" stroke-width="1.5"/>
      <text x="${bx+12}" y="${by+18}" font-size="11.5" fill="var(--muted)" font-weight="600">${TX.pal.station} ${st+1}</text>`;
    for(const layer of [0,1]){
      const i = st + 4*layer, w = cyc[i], x = D.words[w], on = highlight===i, hid = hidden && hidden.has(i), r = results && results[i];
      const ry = by + 26 + layer*44, label = hid ? "?" : w;
      const stroke = r===true ? "var(--ok)" : r===false ? "var(--bad)" : "none";
      s += `<rect x="${bx+6}" y="${ry}" width="${bw-12}" height="40" rx="10" fill="${on?col:"transparent"}" stroke="${stroke}" stroke-width="3"/>
        <circle cx="${bx+24}" cy="${ry+20}" r="11" fill="${col}"/><text x="${bx+24}" y="${ry+24}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--panel)">${i+1}</text>
        <text x="${bx+44}" y="${ry+20}" font-size="${label.length>13?15:17}" font-weight="${layer?400:700}" ${layer?'font-style="italic"':""} fill="${on?"var(--panel)":"var(--ink)"}">${esc(label)}</text>
        ${hid?"":`<text x="${bx+44}" y="${ry+35}" font-size="11" fill="${on?"var(--panel)":"var(--muted)"}">${layer?TX.P:TX.O} · ${x.nr} · ${TX.alive[x.alive]}</text>`}`;
    }
  }
  return s + `</svg>`;
}
function viewPalace(m){
  const P = PAL, g=P.g, d=P.d, cyc=D.cards[d][g], tp=TX.pal;
  const segG = ROM.map((r,i)=>`<button data-g="${i}" class="${g===i?"on":""}">${r}</button>`).join("");
  const segD = D.levels.map((l,i)=>`<button data-d="${i}" class="${d===i?"on":""}">${esc(l)}</button>`).join("");
  let svg, below = "";
  if(P.mode==="walk"){
    const i=P.step, w=cyc[i], x=D.words[w], c=D.concepts[x.nr];
    svg = palaceSVG(g,d,i,null);
    const txt = i<4 ? fmt(tp.stationO,{s:i+1, w:esc(w), nr:x.nr, hook:esc(c.hook), alive:TX.alive[x.alive]})
                    : fmt(tp.stationP,{s:i-3, w:esc(w), link:esc(c.link), alive:TX.alive[x.alive]});
    below = `<div class="chip">${i<4?tp.round1:tp.round2}</div><p class="step">${txt}${i===7?`<br><span class="muted small">${tp.wrap}</span>`:""}</p>
      <div class="row"><button class="btn" id="pv">${tp.prev}</button><button class="btn primary" id="nxs">${tp.nextStep}</button><span class="muted small">${i+1}/8</span><button class="btn link" id="back">${tp.reset}</button></div>`;
  } else if(P.mode==="quiz" || P.mode==="succ"){
    const done = P.qi>=8, i = done?null:P.quizOrder[P.qi];
    const hidden = new Set(P.mode==="quiz" ? [0,1,2,3,4,5,6,7].filter(k=>P.results[k]===undefined) : []);
    svg = palaceSVG(g,d, done?null:(P.mode==="succ"?null:i), hidden, P.results);
    if(done) below = `<p class="step"><b>${fmt(tp.quizDone,{r:P.right})}</b></p><div class="row"><button class="btn primary" id="again">${P.mode==="quiz"?tp.quiz:tp.successorQuiz}</button><button class="btn link" id="back">${tp.reset}</button></div>`;
    else {
      const qtxt = P.mode==="quiz" ? fmt(tp.quizQ,{pos:i+1}) : fmt(tp.succQ,{w:esc(cyc[(i+7)%8])});
      below = `<p class="step">${qtxt}</p>${P.last?`<p class="small">${P.last}</p>`:""}
      <div class="row"><input type="text" id="pin" autocomplete="off" autocapitalize="off" spellcheck="false" style="max-width:280px"><button class="btn primary" id="pok">${TX.check}</button><span class="muted small">${P.qi+1}/8</span><button class="btn link" id="back">${tp.reset}</button></div>`;
    }
  } else {
    svg = palaceSVG(g,d,null,null);
    below = `<div class="row"><button class="btn primary" id="walk">${tp.walk}</button><button class="btn" id="quiz">${tp.quiz}</button><button class="btn" id="succ">${tp.successorQuiz}</button>
      <label class="small muted"><input type="checkbox" id="rand" ${P.rand?"checked":""}> ${tp.random}</label></div>`;
  }
  m.innerHTML = `<div class="panel palace">
    <p class="muted small" style="margin-top:0">${tp.intro}</p>
    <div class="row"><div class="seg">${segG}</div><div class="seg">${segD}</div></div>
    <p class="story">${TX.qo}${esc(D.scenes[g][1])}${TX.qc}</p>
    <div class="mt">${svg}</div>
    <div class="mt">${below}</div>
  </div>`;
  for(const b of m.querySelectorAll("[data-g]")) b.onclick=()=>{PAL={...PAL,g:+b.dataset.g,mode:"view"}; render();};
  for(const b of m.querySelectorAll("[data-d]")) b.onclick=()=>{PAL={...PAL,d:+b.dataset.d,mode:"view"}; render();};
  const startQuiz = mode => { PAL.mode=mode; PAL.qi=0; PAL.right=0; PAL.results={}; PAL.last=null; PAL.quizOrder = PAL.rand? shuffle([0,1,2,3,4,5,6,7]) : [0,1,2,3,4,5,6,7]; render(); };
  if($("#walk")) $("#walk").onclick=()=>{PAL.mode="walk"; PAL.step=0; render();};
  if($("#quiz")) $("#quiz").onclick=()=>startQuiz("quiz");
  if($("#succ")) $("#succ").onclick=()=>startQuiz("succ");
  if($("#rand")) $("#rand").onchange=e=>{PAL.rand=e.target.checked;};
  if($("#again")) $("#again").onclick=()=>startQuiz(PAL.mode);
  if($("#back")) $("#back").onclick=()=>{PAL.mode="view"; render();};
  if($("#pv")) $("#pv").onclick=()=>{PAL.step=(PAL.step+7)%8; render();};
  if($("#nxs")){ $("#nxs").onclick=()=>{PAL.step=(PAL.step+1)%8; render();}; $("#nxs").focus(); }
  if($("#pin")){
    const inp=$("#pin"); inp.focus();
    const go=()=>{
      const i=PAL.quizOrder[PAL.qi], w=cyc[i], ok = norm(inp.value)===norm(w);
      PAL.results[i]=ok; if(ok) PAL.right++;
      PAL.last = `<span class="verdict ${ok?"ok":"bad"}">${ok?TX.right:TX.wrong}</span> ${i+1}. <b>${esc(w)}</b>`;
      PAL.qi++; render();
    };
    $("#pok").onclick=go; inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); go(); } };
  }
}

/* ---------------- performance simulation ---------------- */
let PF = null;
function newSpectator(){
  const d = Math.floor(Math.random()*3), g = Math.floor(Math.random()*4), s = Math.floor(Math.random()*8);
  const page = [0,1,2,3,4,5,6,7].map(i=>D.cards[d][g][(s+i)%8]);
  const k = 1 + Math.floor(Math.random()*7);          // forgotten = page[k], last recalled = page[k-1]
  const others = page.filter((w,i)=>i!==k && i!==k-1);
  PF = {d,g,page,k,last:page[k-1],forgot:page[k],other:pick(others),t0:Date.now(),phase:"name",ans:{}};
  render();
}
function viewPerform(m){
  const tp = TX.perf, hist = S[L].perf;
  const stats = hist.length ? fmt(tp.stats,{n:hist.length, ok:hist.filter(h=>h.ok).length, t:(hist.reduce((a,h)=>a+h.t,0)/hist.length/1000).toFixed(1)}) : tp.none;
  let h = `<div class="panel"><p class="muted small" style="margin-top:0">${tp.intro}</p>
    <div class="row"><button class="btn primary" id="spec">${tp.go}</button><span class="muted small">${stats}</span></div>`;
  if(PF){
    const P=PF;
    h += `<div class="mt spect">${tp.says}<br>${tp.last}: <q>${esc(P.last)}</q><br>${tp.other}: <q>${esc(P.other)}</q></div>`;
    if(P.phase==="name"){
      h += `<div class="mt"><label class="small muted">${tp.forgot}</label><br><input type="text" id="fw" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
        <div class="mt"><label class="small muted">${tp.letter}</label><br><input type="text" id="fl" maxlength="2" autocomplete="off" style="max-width:90px"></div>
        <div class="mt"><span class="small muted">${tp.alive}</span><br><div class="seg" id="fa"><button data-a="1" class="${P.ans.alive===1?"on":""}">${tp.yes}</button><button data-a="0" class="${P.ans.alive===0?"on":""}">${tp.no}</button></div></div>
        <div class="row mt"><button class="btn primary" id="rv">${tp.reveal}</button><span class="timer" id="tm"></span></div>`;
    } else {
      const x = D.words[P.forgot], A = P.ans;
      const mark = ok => `<span class="verdict ${ok?"ok":"bad"}">${ok?"✓":"✗"}</span>`;
      h += `<div class="mt ans"><h3 style="margin-top:0">${tp.solution} <span class="timer">· ${tp.time} ${(P.t/1000).toFixed(1)} s</span></h3>
        <p class="muted small">${fmt(tp.deckOf,{deck:esc(D.levels[P.d]), g:ROM[P.g]})} · ${esc(P.last)} → <b>${esc(P.forgot)}</b></p>
        <p>${mark(A.okW)} <span class="big">${esc(P.forgot)}</span> ${A.w?`<span class="muted small">(${esc(A.w)})</span>`:""}</p>
        <p>${mark(A.okL)} ${tp.letter.replace("?","")}: <b>${esc(x.letter)}</b> <span class="muted small">(${esc(P.forgot)} / ${esc(x.partner)})</span></p>
        <p>${mark(A.okA)} ${TX.alive[x.alive]}</p>
        <p>${tp.reading}: ${esc(readingOf(P.forgot))}</p>
        <h3>${tp.proof}</h3><div class="page"><ol>${P.page.map((w,i)=>`<li class="${i===P.k?"f":i===P.k-1?"l":""}">${esc(w)}</li>`).join("")}</ol></div>
        <p class="muted small">${tp.allRecalled}</p></div>`;
    }
  }
  m.innerHTML = h + `</div>`;
  $("#spec").onclick=newSpectator;
  if(PF && PF.phase==="name"){
    const P=PF; $("#fw").focus();
    for(const b of m.querySelectorAll("#fa button")) b.onclick=()=>{P.ans.alive=+b.dataset.a; for(const bb of m.querySelectorAll("#fa button")) bb.classList.toggle("on", bb===b);};
    const reveal=()=>{
      const x=D.words[P.forgot]; P.t=Date.now()-P.t0;
      P.ans.w=$("#fw").value.trim(); P.ans.l=$("#fl").value.trim();
      P.ans.okW = norm(P.ans.w)===norm(P.forgot); P.ans.okL = norm(P.ans.l)===norm(x.letter); P.ans.okA = P.ans.alive===x.alive;
      const ok = P.ans.okW && P.ans.okL && P.ans.okA;
      S[L].perf = S[L].perf.concat([{ok, t:P.t}]).slice(-20);
      if(st("next-"+P.last) && st("next-"+P.last).box) grade("next-"+P.last, P.ans.okW);
      if(st("rev-"+P.forgot) && st("rev-"+P.forgot).box) grade("rev-"+P.forgot, P.ans.okL && P.ans.okA);
      save(); P.phase="shown"; clearInterval(TIMER); render();
    };
    $("#rv").onclick=reveal;
    for(const id of ["#fw","#fl"]) $(id).onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); reveal(); } };
    clearInterval(TIMER); TIMER=setInterval(()=>{ const t=$("#tm"); if(t) t.textContent=((Date.now()-P.t0)/1000).toFixed(0)+" s"; else clearInterval(TIMER); },500);
  } else if(PF){ $("#spec").focus(); }
}
let TIMER=null;

/* ---------------- reference ---------------- */
function viewRef(m){
  const R = TX.ref;
  let h = `<div class="panel"><ul>${R.rules.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>`;
  for(let d=0; d<3; d++){
    h += `<h3>${esc(D.levels[d])} <span class="muted small">(${esc(D.lenrule[d])})</span></h3><div class="ring">`;
    for(let g=0; g<4; g++){
      h += `<div class="cyc cg${g}"><b>${TX.card} ${ROM[g]}</b> <span class="small muted">${esc(D.scenes[g][0])}</span><ol>${D.cards[d][g].map(w=>`<li class="${D.words[w].t==="O"?"o":""}">${esc(w)} <span class="muted small">${D.words[w].nr} · ${TX.alive[D.words[w].alive]}</span></li>`).join("")}</ol></div>`;
    }
    h += `</div>`;
  }
  h += `<h3>${R.table}</h3><div class="tblwrap"><table><thead><tr><th>${TX.nr}</th><th>${esc(D.levels.join(" / "))}</th><th>${R.hook}</th><th>${TX.P}</th><th>${R.link}</th><th>${TX.alive[1]}?</th><th>${R.reading}</th></tr></thead><tbody>`;
  for(const c of D.concepts){
    h += `<tr class="cg${Math.floor(c.nr/4)}"><td>${c.nr}</td><td><b>${c.o.map(esc).join("</b> · <b>")}</b></td><td>${esc(c.hook)}</td><td><i>${c.p.map(esc).join(" · ")}</i></td><td>${esc(c.link)}</td><td>${TX.O}: ${TX.alive[c.oalive]}<br>${TX.P}: ${TX.alive[1-c.oalive]}</td><td>${esc(c.oread)}<br><i>${esc(c.pread)}</i></td></tr>`;
  }
  m.innerHTML = h + `</tbody></table></div></div>`;
}

/* ---------------- progress ---------------- */
function viewProgress(m){
  const P = TX.prog;
  const rows = TX.lessons.map((name,i)=>{
    const cs = CARDS.filter(c=>c.lesson===i), b = boxCounts(cs);
    return `<tr><td>${i+1}. ${esc(name)}</td><td>${b[4]+b[5]}</td><td>${b[1]+b[2]+b[3]}</td><td>${b[0]}</td><td>${cs.length}</td></tr>`;
  }).join("");
  const hist = S[L].perf;
  m.innerHTML = `<div class="panel"><h2>${P.h}</h2>
    ${STORE_OK?`<p class="muted small">${P.store}</p>`:`<p class="verdict bad">${P.nostore}</p>`}
    <div style="padding-top:16px;max-width:420px">${boxesHTML(CARDS)}</div>
    <div class="tblwrap mt"><table><thead><tr><th></th><th>${P.mastered}</th><th>${P.learning}</th><th>${P.unseen}</th><th>Σ</th></tr></thead><tbody>${rows}</tbody></table></div>
    <h3>${P.perfH}</h3><p class="small">${hist.length?hist.map(h=>`<span class="verdict ${h.ok?"ok":"bad"}">${h.ok?"✓":"✗"}</span> ${(h.t/1000).toFixed(1)}s`).join(" · "):TX.perf.none}</p>
    <div class="row mt"><button class="btn" id="exp">${P.export}</button><label class="btn">${P.import}<input type="file" id="imp" accept="application/json,.json" class="hide"></label>
    <button class="btn link" id="rst" style="color:var(--bad)">${P.reset}</button><button class="btn link" id="thm">${TX.theme}</button></div></div>`;
  $("#exp").onclick=()=>{
    const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}), a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=`forgetmenot-trainer-${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click(); a.remove();
  };
  $("#imp").onchange=e=>{
    const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const x=JSON.parse(r.result); if(!x.de||!x.en) throw 0; S=x; for(const l of ["de","en"]) S[l]=Object.assign({cards:{},lessons:[true,true,true,true,true,true],newPer:10,perf:[]},S[l]); S.tab="progress"; save(); setLang(S.lang||"de"); alert(P.imported);}catch(err){ alert(P.bad); } };
    r.readAsText(f);
  };
  $("#rst").onclick=()=>{ if(confirm(P.confirm)){ S[L].cards={}; S[L].perf=[]; save(); render(); } };
  $("#thm").onclick=()=>{ const r=document.documentElement, dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark?"light":"dark"; S.theme=r.dataset.theme; save(); };
}

/* ---------------- wiring ---------------- */
function setLang(l){ L=S.lang=l; D=DATA[L]; TX=T[L]; CARDS=makeCards(); BYID=Object.fromEntries(CARDS.map(c=>[c.id,c])); SESSION=null; PF=null; PAL.mode="view"; save(); render(); }
$("#langSeg").onclick=e=>{ const b=e.target.closest("button"); if(b && b.dataset.l!==L) setLang(b.dataset.l); };
$("#tabs").onclick=e=>{ const b=e.target.closest("button"); if(b){ S.tab=b.dataset.t; save(); clearInterval(TIMER); render(); window.scrollTo(0,0);} };
if(S.theme) document.documentElement.dataset.theme = S.theme;
if(!TABS.includes(S.tab)) S.tab="learn";
render();
</script>
